name: cassis publish

# Publishing depends on how this repository is wired:
#   - Cassis GitHub App installed and bound to the project: merging to main is
#     enough, the webhook imports the commit. DELETE this file, or a merge can
#     record a redundant extra version.
#   - Any other provider, or no App: the `publish` job below is what publishes.
#
# Pull-request checks live in ontology.yml. Keeping publish in its own file
# means a pull request never lists a skipped publish job.

on:
  push:
    branches: [main]
    paths: ["cassis/**"]

env:
  CASSIS_API_KEY: ${{ secrets.CASSIS_API_KEY }}
  CASSIS_PROJECT_ID: ${{ vars.CASSIS_PROJECT_ID }}

jobs:
  configured:
    name: credentials present
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.probe.outputs.ready }}
    steps:
      - id: probe
        run: echo "ready=${CASSIS_API_KEY:+yes}" >> "$GITHUB_OUTPUT"

  check:
    name: ontology validation
    needs: configured
    if: needs.configured.outputs.ready == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-cassis.txt
      - name: cassis ontology fmt --check
        run: cassis ontology fmt --check
      - name: cassis ontology check
        run: cassis ontology check

  publish:
    name: publish to Cassis
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-cassis.txt
      - name: cassis ontology upload
        run: cassis ontology upload
